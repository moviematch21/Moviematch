<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieMatch — Find Your Movie</title>
<meta name="description" content="Answer 5 quick questions and discover your movie match.">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#0d0d12;color:#fff;min-height:100vh}
  .app{max-width:520px;margin:auto;min-height:100vh;padding:22px 18px 40px}
  .brand{font-weight:800;font-size:18px;letter-spacing:.3px;margin-bottom:42px}
  .brand span{color:#ff4f87}
  .hero{text-align:center;padding:20px 4px 30px}
  .emoji{font-size:52px;margin-bottom:14px}
  h1{font-size:34px;line-height:1.08;margin:0 0 12px}
  .sub{color:#b7b7c2;line-height:1.5;font-size:15px}
  button{border:0;cursor:pointer;font:inherit}
  .primary{width:100%;padding:16px;border-radius:16px;background:#ff4f87;color:#fff;font-weight:800;font-size:16px;margin-top:24px}
  .primary:active,.option:active{transform:scale(.98)}
  .progress{height:6px;background:#24242c;border-radius:99px;overflow:hidden;margin:8px 0 24px}
  .bar{height:100%;width:20%;background:#ff4f87;transition:.25s}
  .qnum{color:#ff7aa5;font-size:13px;font-weight:700;margin-bottom:9px}
  h2{font-size:25px;line-height:1.2;margin:0 0 18px}
  .options{display:grid;gap:11px}
  .option{background:#18181f;border:1px solid #292932;color:#fff;padding:16px;border-radius:15px;text-align:left;transition:.15s}
  .option:hover{border-color:#ff4f87}
  .option small{display:block;color:#9696a3;margin-top:5px}
  .result{text-align:center;padding-top:8px}
  .badge{display:inline-block;background:#24151d;color:#ff86a9;border:1px solid #5b263b;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:15px}
  .movie{background:#18181f;border:1px solid #2b2b35;border-radius:22px;padding:22px;text-align:left;margin-top:18px}
  .movie h3{font-size:25px;margin:0 0 7px}
  .movie .meta{color:#aaaab5;font-size:13px;margin-bottom:15px}
  .why{color:#ddd;line-height:1.55;font-size:14px}
  .actions{display:grid;gap:10px;margin-top:18px}
  .secondary{padding:14px;border-radius:14px;background:#24242c;color:#fff;font-weight:700}
  .share{padding:14px;border-radius:14px;background:#fff;color:#111;font-weight:800}
  .note{color:#777783;font-size:11px;text-align:center;margin-top:18px;line-height:1.5}
  .hide{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="brand">🎬 Movie<span>Match</span></div>

  <section id="home" class="hero">
    <div class="emoji">🍿</div>
    <h1>Find the movie you NEED to watch tonight.</h1>
    <p class="sub">Answer 5 quick questions and we'll match your mood with a movie.</p>
    <button class="primary" onclick="start()">START THE TEST →</button>
  </section>

  <section id="quiz" class="hide">
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="qnum" class="qnum"></div>
    <h2 id="question"></h2>
    <div id="options" class="options"></div>
  </section>

  <section id="result" class="result hide">
    <div class="emoji">🎯</div>
    <div class="badge" id="type"></div>
    <h1>Your Movie Match</h1>
    <div class="movie">
      <h3 id="movie"></h3>
      <div class="meta" id="meta"></div>
      <div class="why" id="why"></div>
    </div>
    <div class="actions">
      <button class="share" onclick="shareResult()">SHARE MY MATCH ↗</button>
      <button class="secondary" onclick="restart()">TRY ANOTHER TEST</button>
    </div>
    <p class="note">MovieMatch is a recommendation concept. Availability may vary by country and streaming service.</p>
  </section>
</div>

<script>
const questions = [
 {q:"What's your mood tonight?", opts:[
   ["😂","I want to laugh","Light & fun"],
   ["🧠","I want to think","Mystery & mind games"],
   ["❤️","I want feelings","Emotional & romantic"],
   ["😱","Give me suspense","Thriller & tension"]
 ]},
 {q:"How much time do you have?", opts:[
   ["⚡","Under 2 hours","Quick watch"],
   ["🍿","Around 2 hours","Perfect movie night"],
   ["🛋️","I have time","Longer story is fine"],
   ["🌙","I can binge","I want something absorbing"]
 ]},
 {q:"Pick a setting.", opts:[
   ["🏙️","Modern city","Real-world vibe"],
   ["🌌","Strange / unknown","Something different"],
   ["🏠","Relatable life","Characters I understand"],
   ["🗺️","A whole new world","Adventure"]
 ]},
 {q:"What matters most?", opts:[
   ["🤣","Entertainment","Keep me hooked"],
   ["🤯","Plot twist","Surprise me"],
   ["🥹","Emotions","Make me feel something"],
   ["✨","Experience","Great atmosphere"]
 ]},
 {q:"Who are you watching with?", opts:[
   ["🙋","Just me","My choice"],
   ["👯","Friends","Something everyone enjoys"],
   ["❤️","Partner","Something with feelings"],
   ["👨‍👩‍👧","Family","Easy to watch together"]
 ]}
];

let answers=[];
let step=0;

const results=[
 {type:"THE TWIST HUNTER 🧠", movie:"Shutter Island", meta:"Mystery • Psychological Thriller", why:"You chose curiosity, suspense and plot twists. You probably enjoy movies that make you question what is really happening."},
 {type:"THE FEELER ❤️", movie:"The Fault in Our Stars", meta:"Romance • Drama", why:"You picked emotion and connection. Tonight you need a story that actually makes you feel something."},
 {type:"THE FUN SEEKER 😂", movie:"3 Idiots", meta:"Comedy • Drama", why:"You want entertainment with heart. A funny, relatable story with memorable characters fits your mood."},
 {type:"THE MIND-BENDER 🤯", movie:"Inception", meta:"Sci‑Fi • Thriller", why:"You don't just want a movie—you want a puzzle. This is for a night when you want to think after the credits."},
 {type:"THE ADVENTURER 🗺️", movie:"Interstellar", meta:"Sci‑Fi • Adventure • Drama", why:"You chose the unknown and a big-screen experience. Go for a story that feels bigger than everyday life."},
 {type:"THE COMFORT WATCHER 🛋️", movie:"Zindagi Na Milegi Dobara", meta:"Comedy • Drama • Adventure", why:"You want something easy to connect with, but still memorable. This is a great friends-and-life kind of watch."},
 {type:"THE NIGHT OWL 🌙", movie:"Gone Girl", meta:"Mystery • Thriller", why:"You want something absorbing enough to keep you locked in. This one rewards attention and keeps the tension moving."},
 {type:"THE ROMANTIC 🌹", movie:"Jab We Met", meta:"Romance • Comedy", why:"You picked feelings with a lighter side. You need chemistry, humour and characters you'll want to root for."},
 {type:"THE STORY LOVER ✨", movie:"Taare Zameen Par", meta:"Drama • Family", why:"You care about the experience and the emotional journey. Tonight calls for a story with warmth and meaning."},
 {type:"THE CROWD-PLEASER 🍿", movie:"3 Idiots", meta:"Comedy • Drama", why:"You want a movie that works with other people too—fun, emotional and easy to talk about afterward."}
];

function start(){
 document.getElementById("home").classList.add("hide");
 document.getElementById("result").classList.add("hide");
 document.getElementById("quiz").classList.remove("hide");
 answers=[]; step=0; render();
}
function render(){
 const item=questions[step];
 document.getElementById("qnum").textContent=`QUESTION ${step+1} OF ${questions.length}`;
 document.getElementById("question").textContent=item.q;
 document.getElementById("bar").style.width=((step+1)/questions.length*100)+"%";
 const box=document.getElementById("options");
 box.innerHTML="";
 item.opts.forEach((o,i)=>{
   const b=document.createElement("button");
   b.className="option";
   b.innerHTML=`<b>${o[0]} ${o[1]}</b><small>${o[2]}</small>`;
   b.onclick=()=>choose(i);
   box.appendChild(b);
 });
}
function choose(i){
 answers.push(i);
 step++;
 if(step<questions.length) render(); else showResult();
}
function showResult(){
 document.getElementById("quiz").classList.add("hide");
 document.getElementById("result").classList.remove("hide");
 // Deterministic but varied: all answers influence the selected result.
 let score=answers.reduce((a,v,i)=>a+(v*(i+1)),0);
 let r=results[score % results.length];
 document.getElementById("type").textContent=r.type;
 document.getElementById("movie").textContent=r.movie;
 document.getElementById("meta").textContent=r.meta;
 document.getElementById("why").textContent=r.why;
 window.scrollTo({top:0,behavior:"smooth"});
}
async function shareResult(){
 const text="I just found my movie match on MovieMatch 🍿 Try the test!";
 if(navigator.share){
   try{await navigator.share({title:"MovieMatch",text:text,url:location.href});}catch(e){}
 }else{
   try{await navigator.clipboard.writeText(location.href);alert("Link copied!");}catch(e){alert("Copy this page link and share it.");}
 }
}
function restart(){start();}
</script>
</body>
</html>
